<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background: Shorts red gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Play button (white) -->
  <circle cx="64" cy="64" r="34" fill="#FFFFFF"/>
  <polygon points="54,46 54,82 86,64" fill="#FF0000"/>

  <!-- "AI" text -->
  <text x="64" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI</text>
</svg>
