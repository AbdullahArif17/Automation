polling:
  interval_seconds: 180  # check every 3 minutes
  max_job_age_minutes: 60  # only alert for jobs posted in the last 60 minutes

filters:
  min_budget_usd: 30
  queries:
    - "fastapi"
    - "next.js"
    - "react"
    - "python automation"
    - "playwright"
    - "web scraping"
    - "rag"
    - "llm"
    - "full stack"

